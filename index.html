<title>N2 听力 · 即时应答</title>
<style>
  :root {
    --bg: #f4efe6;
    --paper: #fffdf8;

    --line: #e6dfd2;
    --accent: #9a3412;
    --accent-soft: #ffedd5;
    --good: #047857;
    --good-bg: #ecfdf5;
    --bad: #be123c;
    --bad-bg: #fff1f2;
    --chip: #fff;
    --shadow: 0 8px 28px rgba(28, 25, 23, 0.08);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC",
      "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP",
      system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: calc(10px + var(--safe-top)) 12px calc(10px + var(--safe-bottom));
    max-width: 640px;
    margin: 0 auto;
  }
  header { flex: 0 0 auto; }
  h1 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); font-weight: 600; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    line-height: 1.3;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .chip.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .chip.forgotten.active {
    background: var(--bad);
    border-color: var(--bad);
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    min-height: 32px;
  }
  .pos {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .tools { display: flex; gap: 6px; align-items: center; }
  .btn {
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    border-radius: 10px;
    padding: 6px 11px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    font-family: inherit;
  }
  .btn.active {
    background: var(--accent-soft);
    border-color: #fdba74;
    color: var(--accent);
  }
  .btn.ghost { background: transparent; color: var(--muted); font-size: 12px; padding: 6px 8px; }
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .card-wrap {
    flex: 1 1 auto;
    min-height: 220px;
    perspective: 1400px;
    touch-action: none;
    position: relative;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }
  .front { transform: rotateY(0deg) translateZ(1px); }
  .back { transform: rotateY(180deg) translateZ(1px); }
  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    flex: 0 0 auto;
  }
  .pattern {
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.45;
    flex: 0 0 auto;
  }
  .jp {
    font-size: 22px;
    line-height: 1.55;
    font-weight: 600;
    letter-spacing: 0.01em;
    flex: 1 1 auto;
  }
  .speaker { font-size: 13px; color: var(--muted); font-weight: 600; margin-right: 2px; }
  .hint {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 14px;
  }
  .label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin: 0 0 6px;
  }
  .zh {
    margin-top: 12px;
    font-size: 14px;
    color: #44403c;
    line-height: 1.55;
  }
  .zh b { color: var(--muted); font-weight: 600; margin-right: 4px; }
  .badge {
    display: inline-block;
    margin-top: 14px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 12px;
    font-weight: 600;
    align-self: flex-start;
  }
  .empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    background: var(--paper);
    border: 1px dashed var(--line);
    border-radius: 18px;
    padding: 24px;
    font-size: 15px;
    line-height: 1.6;
  }
  .actions {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .actions .btn { flex: 1; padding: 12px 10px; font-size: 15px; font-weight: 650; border-radius: 12px; }
  .btn.bad { background: var(--bad-bg); color: var(--bad); border-color: #fecdd3; }
  .btn.good { background: var(--good-bg); color: var(--good); border-color: #a7f3d0; }
  .nav {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .nav .btn { flex: 1; }

  .strategy {
    font-size: 13px;
    line-height: 1.5;
    color: #57534e;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 10px;
    padding: 8px 10px;
    margin: 0 0 8px;
  }
  .origin {
    font-size: 11px;
    color: var(--muted);
    margin: -4px 0 12px;
    flex: 0 0 auto;
  }
  .hint-strategy {
    flex: 0 0 auto;
    margin-top: 14px;
    font-size: 12px;
    line-height: 1.5;
    color: #9a3412;
    background: #fff7ed;
    border-radius: 10px;
    padding: 8px 10px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>N2 听力 · <span>即时应答</span></h1>
    <div class="filters" id="filters"></div>
    <div class="strategy hidden" id="strategy"></div>
    <div class="toolbar">
      <div class="pos" id="pos">0 / 0</div>
      <div class="tools">
        <button type="button" class="btn" id="shuffleBtn" aria-pressed="false">乱序</button>

      </div>
    </div>
  </header>

  <div class="stage">
    <div class="card-wrap" id="cardWrap">
      <div class="card" id="card">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
      <div class="empty hidden" id="empty"></div>
    </div>
    <div class="actions hidden" id="markActions">
      <button type="button" class="btn bad" id="forgetBtn">没记住</button>
      <button type="button" class="btn good" id="rememberBtn">记住了</button>
    </div>
    <div class="nav" id="nav">
      <button type="button" class="btn" id="prevBtn">上一张</button>
      <button type="button" class="btn" id="nextBtn">下一张</button>
    </div>
  </div>

const STORAGE_KEY = "n2-sokuji-v1";

const $ = (id) => document.getElementById(id);
const filtersEl = $("filters");
const posEl = $("pos");
const shuffleBtn = $("shuffleBtn");
const clearBtn = $("clearBtn");
const cardWrap = $("cardWrap");
const cardEl = $("card");
const frontEl = $("front");
const backEl = $("back");
const emptyEl = $("empty");
const markActions = $("markActions");
const forgetBtn = $("forgetBtn");
const rememberBtn = $("rememberBtn");
const prevBtn = $("prevBtn");
const nextBtn = $("nextBtn");

function loadMarks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return new Set();
    const data = JSON.parse(raw);
    const list = Array.isArray(data) ? data : (data && data.forgotten) || [];
    return new Set(list);
  } catch (e) {
    return new Set();
  }
}

function saveMarks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ forgotten: Array.from(marks) }));
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function quoteLine(speaker, text) {
  const q = "「" + text + "」";
  if (!speaker) return q;
  return '<span class="speaker">' + speaker + "</span>" + q;
}

function groupOf(card) {
  return GROUPS.find((g) => g.id === card.group);
}

let marks = loadMarks();
let filter = "all"; // "all" | "forgotten" | group number
let shuffled = false;
let index = 0;
let flipped = false;
let list = [];
let ignoreClick = false;

function buildList() {
  let src;
  if (filter === "all") src = CARDS.slice();
  else if (filter === "forgotten") src = CARDS.filter((c) => marks.has(c.id));
  else src = CARDS.filter((c) => c.group === filter);
  list = shuffled ? shuffleArray(src) : src;
  if (index >= list.length) index = Math.max(0, list.length - 1);
}

function renderStrategy() {
  const el = $("strategy");
  if (typeof filter === "number") {
    const g = GROUPS.find((x) => x.id === filter);
    el.textContent = g ? g.strategy : "";
    el.classList.toggle("hidden", !g);
  } else {
    el.textContent = "";
    el.classList.add("hidden");
  }
}

function renderFilters() {
  const parts = [];
  const allActive = filter === "all" ? " active" : "";
  parts.push('<button type="button" class="chip' + allActive + '" data-filter="all">全部 · ' + CARDS.length + "</button>");
  GROUPS.forEach((g) => {
    const n = CARDS.filter((c) => c.group === g.id).length;
    const active = filter === g.id ? " active" : "";
    parts.push(
      '<button type="button" class="chip' + active + '" data-filter="' + g.id + '">' +
      g.id + " " + g.name + " · " + n + "</button>"
    );
  });
  const fc = marks.size;
  const fActive = filter === "forgotten" ? " active forgotten" : "";
  parts.push('<button type="button" class="chip forgotten' + fActive + '" data-filter="forgotten">没记住 · ' + fc + "</button>");
  filtersEl.innerHTML = parts.join("");
  renderStrategy();
}

function renderCard() {
  posEl.textContent = list.length ? (index + 1) + " / " + list.length : "0 / 0";
  shuffleBtn.classList.toggle("active", shuffled);
  shuffleBtn.setAttribute("aria-pressed", shuffled ? "true" : "false");
  shuffleBtn.textContent = shuffled ? "顺序" : "乱序";

  if (!list.length) {
    cardEl.classList.add("hidden");
    markActions.classList.add("hidden");
    emptyEl.classList.remove("hidden");
    emptyEl.textContent = filter === "forgotten"
      ? "还没有「没记住」的卡片。翻面后点「没记住」，之后就可以只刷这些。"
      : "这个分组里没有卡片。";
    return;
  }

  emptyEl.classList.add("hidden");
  cardEl.classList.remove("hidden");
  cardEl.classList.toggle("flipped", flipped);
  markActions.classList.toggle("hidden", !flipped);

  const c = list[index];
  const g = groupOf(c);
  const meta = "第" + g.id + "组 · " + g.name;
  const origin = "原分类：" + c.origin;
  const practice = c.practice ? '<div class="badge">练习题' + c.practice + "</div>" : "";
  const think = '<div class="hint-strategy">答题思路：' + g.strategy + "</div>";

  frontEl.innerHTML =
    '<div class="meta">' + meta + "</div>" +
    '<div class="origin">' + origin + "</div>" +
    '<div class="pattern">' + c.pattern + "</div>" +
    '<div class="jp">' + quoteLine(c.prompt_speaker, c.prompt) + "</div>" +
    '<div class="hint">点击看答案 · 左右滑动切换</div>';

  backEl.innerHTML =
    '<div class="meta">' + meta + "</div>" +
    '<div class="origin">' + origin + "</div>" +
    '<div class="pattern">' + c.pattern + "</div>" +
    '<div class="label">回答</div>' +
    '<div class="jp">' + quoteLine(c.answer_speaker, c.answer) + "</div>" +
    '<div class="zh"><b>问：</b>' + c.prompt_zh + "</div>" +
    '<div class="zh"><b>答：</b>' + c.answer_zh + "</div>" +
    practice +
    think;
}

function go(to, resetFlip) {
  if (!list.length) { renderCard(); return; }
  const n = list.length;
  index = ((to % n) + n) % n;
  if (resetFlip !== false) flipped = false;
  renderCard();
}

function setFilter(next) {
  filter = next;
  index = 0;
  flipped = false;
  buildList();
  renderFilters();
  renderCard();
}

filtersEl.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-filter]");
  if (!btn) return;
  const v = btn.getAttribute("data-filter");
  setFilter(v === "all" || v === "forgotten" ? v : Number(v));
});

shuffleBtn.addEventListener("click", () => {
  shuffled = !shuffled;
  const currentId = list[index] && list[index].id;
  buildList();
  if (currentId) {
    const i = list.findIndex((c) => c.id === currentId);
    index = i >= 0 ? i : 0;
  } else {
    index = 0;
  }
  flipped = false;
  renderCard();
});

clearBtn.addEventListener("click", () => {
  if (!marks.size) return;
  if (!confirm("清空全部「没记住」标记？")) return;
  marks = new Set();
  saveMarks();
  if (filter === "forgotten") {
    index = 0;
    flipped = false;
    buildList();
  }
  renderFilters();
  renderCard();
});

cardEl.addEventListener("click", (e) => {
  if (ignoreClick) { ignoreClick = false; return; }
  if (e.target.closest("button")) return;
  if (!list.length) return;
  flipped = !flipped;
  renderCard();
});

forgetBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const c = list[index];
  if (!c) return;
  marks.add(c.id);
  saveMarks();
  renderFilters();
  if (filter === "forgotten") {
    buildList();
    const i = list.findIndex((x) => x.id === c.id);
    index = i >= 0 ? i : index;
    go(index + (list.length ? 1 : 0));
  } else {
    go(index + 1);
  }
});

rememberBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const c = list[index];
  if (!c) return;
  const id = c.id;
  marks.delete(id);
  saveMarks();
  renderFilters();
  if (filter === "forgotten") {
    const nextId = list[index + 1] ? list[index + 1].id : (list[0] && list[0].id !== id ? list[0].id : null);
    buildList();
    if (!list.length) { index = 0; flipped = false; renderCard(); return; }
    const i = nextId ? list.findIndex((x) => x.id === nextId) : 0;
    go(i >= 0 ? i : 0);
  } else {
    go(index + 1);
  }
});

prevBtn.addEventListener("click", () => go(index - 1));
nextBtn.addEventListener("click", () => go(index + 1));

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); go(index - 1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); go(index + 1); }
  else if (e.key === " " || e.key === "Enter") {
    if (e.target && (e.target.tagName === "BUTTON")) return;
    e.preventDefault();
    if (!list.length) return;
    flipped = !flipped;
    renderCard();
  }
});

let startX = 0, startY = 0, tracking = false, swiping = false;

cardWrap.addEventListener("touchstart", (e) => {
  const t = e.changedTouches[0];
  startX = t.clientX;
  startY = t.clientY;
  tracking = true;
  swiping = false;
}, { passive: true });

cardWrap.addEventListener("touchmove", (e) => {
  if (!tracking) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;
  if (!swiping && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) {
    swiping = true;
  }
  if (swiping) e.preventDefault();
}, { passive: false });

cardWrap.addEventListener("touchend", (e) => {
  if (!tracking) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;
  tracking = false;
  if (swiping && Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy)) {
    ignoreClick = true;
    if (dx < 0) go(index + 1);
    else go(index - 1);
  }
  swiping = false;
}, { passive: true });

cardWrap.addEventListener("touchcancel", () => { tracking = false; swiping = false; });

buildList();
renderFilters();
renderCard();
</script>
</body>
</html>
